services:
  db:
    image: mysql:8.4.3
    environment:
      MYSQL_DATABASE: sparcc
      MYSQL_USER: sparcc
      MYSQL_PASSWORD: sparcc
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-usparcc", "-psparcc"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    environment: &app-env
      SECRET_KEY: ${SECRET_KEY:-dev-local-inseguro}
      ENVIRONMENT: PROD
      DBTYPE: MySQL
      DBNAME: sparcc
      DBUSER: sparcc
      DBPASSWORD: sparcc
      DBHOST: db
      DBPORT: "3306"
    volumes:
      - static:/var/www/html/Morea/static
      - media:/var/www/html/Morea/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')"]
      interval: 5s
      timeout: 5s
      retries: 30

  cron:
    build: .
    command: ["sh", "scripts/cron.sh"]
    environment: *app-env
    volumes:
      - media:/var/www/html/Morea/media
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27.2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/html/Morea/static:ro
      - media:/var/www/html/Morea/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  static:
  media:
