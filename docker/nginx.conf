# Baseado em config/morea.conf (que tem placeholders CHANGE-* e um location sem fechar)
server {
    listen 80;
    server_name _;
    client_max_body_size 32M;

    location /static/ {
        alias /var/www/html/Morea/static/;
    }

    location /media/ {
        alias /var/www/html/Morea/media/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
